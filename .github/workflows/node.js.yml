name: Update README with Performance Test Results

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-performance-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [12, 14, 16, 18, 20, 22, 24, 25]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Performance Test
        run: |
          node test-loops.js
          mv performance-results.txt result-${{ matrix.node-version }}.txt

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.node-version }}
          path: result-${{ matrix.node-version }}.txt

  update-readme:
    runs-on: ubuntu-latest
    needs: run-performance-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Overwrite README with New Data
        shell: python
        run: |
          import os

          results_map = {}
          all_metrics = []
          base_path = "all-results"
          
          # 1. Dynamically collect results
          if os.path.exists(base_path):
              for folder in sorted(os.listdir(base_path)):
                  version = folder.replace("results-", "")
                  file_path = os.path.join(base_path, folder, f"result-{version}.txt")
                  
                  if os.path.exists(file_path):
                      with open(file_path, "r") as f:
                          data = {}
                          for line in f:
                              if ":" in line:
                                  k, v = line.split(":", 1)
                                  metric_name = k.strip()
                                  data[metric_name] = v.strip()
                                  if metric_name not in all_metrics:
                                      all_metrics.append(metric_name)
                          results_map[version] = data

          # 2. Build Markdown content
          title = "# JavaScript Loop Performance Test Results\n\n"
          desc = "> **Unit:** milliseconds (ms). **Lower is better.** Rounded to nearest integer.\n\n"
          
          # Table Headers
          header = "| Node.js | " + " | ".join(all_metrics) + " |\n"
          sep = "|---| " + "---| " * len(all_metrics) + "\n"
          
          # Table Rows
          rows = ""
          # Sort by version number
          for v in sorted(results_map.keys(), key=lambda x: int(x)):
              row = [v]
              for m in all_metrics:
                  row.append(results_map[v].get(m, "N/A"))
              rows += "| " + " | ".join(row) + " |\n"
          
          # 3. Complete Rewrite
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(title + desc + header + sep + rows)

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update performance results [skip ci]" || exit 0
          git push
