name: Update README with Performance Test Results

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-performance-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 只保留已发布的稳定版本
        node-version: [12, 14, 16, 18, 20, 22, 24, 25]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Test
        run: |
          node test-loops.js
          # 假设输出文件为 performance-results.txt，重命名以防冲突
          mv performance-results.txt result-${{ matrix.node-version }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.node-version }}
          path: result-${{ matrix.node-version }}.txt

  update-readme:
    runs-on: ubuntu-latest
    needs: run-performance-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Process Data and Update README
        shell: python
        run: |
          import os, re

          # 1. 扫描所有结果文件并解析
          results_map = {}
          metrics = ["do...while", "while", "for", "map", "reduce", "filter", "forEach", "for...of", "for...in"]
          base_path = "all-results"
          
          for folder in sorted(os.listdir(base_path)):
              file_path = os.path.join(base_path, folder, folder.replace("results-", "result-") + ".txt")
              if os.path.exists(file_path):
                  v = folder.split("-")[1]
                  with open(file_path, "r") as f:
                      # 兼容 "key: value" 或 "key, value" 格式
                      data = dict(line.replace(":", ",").split(",") for line in f if "," in line or ":" in line)
                      results_map[v] = [data.get(m, "N/A").strip() for m in metrics]

          # 2. 生成 Markdown 表格
          header = "| Node.js | " + " | ".join(metrics) + " |\n"
          separator = "|---" * (len(metrics) + 1) + "|\n"
          rows = ""
          for ver in sorted(results_map.keys(), key=int):
              rows += f"| {ver} | " + " | ".join(results_map[ver]) + " |\n"
          
          table_content = f"\n{header}{separator}{rows}"

          # 3. 写入 README
          readme_file = "README.md"
          content = open(readme_file, "r").read() if os.path.exists(readme_file) else "## Performance\n\n\n"
          
          if "" in content:
              new_content = re.sub(r".*?", table_content, content, flags=re.DOTALL)
          else:
              new_content = content + "\n\n" + table_content
          
          with open(readme_file, "w") as f:
              f.write(new_content)

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update performance results [skip ci]" || exit 0
          git push
