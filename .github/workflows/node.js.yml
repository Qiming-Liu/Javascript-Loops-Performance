name: Update README with Performance Test Results

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-performance-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [12, 14, 16, 18, 20, 22, 24, 25]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Test
        run: |
          node test-loops.js
          mv performance-results.txt result-${{ matrix.node-version }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.node-version }}
          path: result-${{ matrix.node-version }}.txt

  update-readme:
    runs-on: ubuntu-latest
    needs: run-performance-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Overwrite README with New Table
        shell: python
        run: |
          import os

          # 1. 采集所有已下载的版本数据
          results_map = {}
          metrics = ["do...while", "while", "for", "map", "reduce", "filter", "forEach", "for...of", "for...in"]
          base_path = "all-results"
          
          # 遍历所有下载的 artifact 目录
          for folder in os.listdir(base_path):
              version = folder.replace("results-", "")
              file_path = os.path.join(base_path, folder, f"result-{version}.txt")
              if os.path.exists(file_path):
                  with open(file_path, "r") as f:
                      # 兼容冒号或逗号分隔符，提取 key 和 value
                      data = {}
                      for line in f:
                          if ":" in line or "," in line:
                              parts = line.replace(":", ",").split(",")
                              if len(parts) >= 2:
                                  data[parts[0].strip()] = parts[1].strip()
                      results_map[version] = [data.get(m, "N/A") for m in metrics]

          # 2. 生成全新的 Markdown 内容
          title = "# JavaScript Loop Performance Test Results\n\n"
          description = "> 测试单位: 毫秒 (ms)，数值越低性能越好。每次测试由 GitHub Actions 自动生成并覆盖此文件。\n\n"
          
          header = "| Node.js | " + " | ".join(metrics) + " |\n"
          sep = "|---| " + "---| " * len(metrics) + "\n"
          
          rows = ""
          # 按 Node 版本数值大小排序
          sorted_versions = sorted(results_map.keys(), key=lambda x: int(x))
          for v in sorted_versions:
              rows += f"| {v} | " + " | ".join(results_map[v]) + " |\n"
          
          full_content = title + description + header + sep + rows

          # 3. 彻底覆盖写入 README.md ("w" 模式会删除文件原内容)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(full_content)

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # 即使内容没变也不报错
          git commit -m "docs: complete rewrite of README with latest results" || exit 0
          git push
