name: Update README with Performance Test Results

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-performance-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [12, 14, 16, 18, 20, 22, 24, 25, 26]

    name: Node.js ${{ matrix.node-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test
        run: |
          node test-loops.js
          mv performance-results.txt results-${{ matrix.node-version }}.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.node-version }}
          path: results-${{ matrix.node-version }}.txt

  update-readme:
    runs-on: ubuntu-latest
    needs: run-performance-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Generate Markdown Table
        id: table-gen
        run: |
          # 动态构建表格内容
          TABLE="| Node.js | do...while | while | for | map | reduce | filter | forEach | for...of | for...in |\n"
          TABLE+="|---|---|---|---|---|---|---|---|---|---|\n"
          
          # 遍历下载的所有结果目录
          for dir in all-results/results-*; do
            version=$(basename $dir | sed 's/results-//')
            file="$dir/results-$version.txt"
            
            if [ -f "$file" ]; then
              # 使用 declare 创建关联数组解析 key:value
              declare -A results
              while IFS=: read -r key value; do
                results[$(echo $key | xargs)]=$(echo $value | xargs)
              done < "$file"
              
              row="| $version | ${results[do...while]} | ${results[while]} | ${results[for]} | ${results[map]} | ${results[reduce]} | ${results[filter]} | ${results[forEach]} | ${results[for...of]} | ${results[for...in]} |"
              TABLE+="$row\n"
              unset results
            fi
          done
          
          # 使用环境变量写入，避免多行字符串导致的转义问题
          echo "PERF_TABLE<<EOF" >> $GITHUB_ENV
          echo -e "$TABLE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update README.md
        run: |
          # 如果 README 里没有标记，就先初始化它们
          if ! grep -q "" README.md; then
            echo -e "\n## Performance Results\n\n" >> README.md
          fi
          
          # 使用 sed 替换两个标记之间的内容
          # 先提取标记前后的内容，重新组合
          sed -i '//,//{//!d;}' README.md
          sed -i '//a '"$PERF_TABLE"'' README.md

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update performance results [skip ci]" || echo "No changes"
          git push
