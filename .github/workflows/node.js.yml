name: Update README with Performance Test Results

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-performance-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [12, 14, 16, 18, 20, 22, 24, 25]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Performance Test
        run: |
          # The test script should output results in 'key: value' format
          node test-loops.js
          mv performance-results.txt result-${{ matrix.node-version }}.txt

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.node-version }}
          path: result-${{ matrix.node-version }}.txt

  update-readme:
    runs-on: ubuntu-latest
    needs: run-performance-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Overwrite README with New Data
        shell: python
        run: |
          import os

          # 1. Collect all data from downloaded artifacts
          results_map = {}
          metrics = ["do...while", "while", "for", "map", "reduce", "filter", "forEach", "for...of", "for...in"]
          base_path = "all-results"
          
          if os.path.exists(base_path):
              for folder in os.listdir(base_path):
                  # Extract version from folder name
                  version = folder.replace("results-", "")
                  file_path = os.path.join(base_path, folder, f"result-{version}.txt")
                  
                  if os.path.exists(file_path):
                      data = {}
                      with open(file_path, "r") as f:
                          for line in f:
                              if ":" in line:
                                  key, val = line.split(":", 1)
                                  # Round the value to ensure integer format
                                  try:
                                      data[key.strip()] = str(round(float(val.strip())))
                                  except:
                                      data[key.strip()] = val.strip()
                      
                      results_map[version] = [data.get(m, "N/A") for m in metrics]

          # 2. Construct the new Markdown content (Total Overwrite)
          title = "# JavaScript Loop Performance Test Results\n\n"
          desc = "> **Unit:** milliseconds (ms). **Lower is better.** Generated automatically via GitHub Actions.\n\n"
          
          header = "| Node.js | " + " | ".join(metrics) + " |\n"
          sep = "|---| " + "---| " * len(metrics) + "\n"
          
          rows = ""
          # Sort versions numerically for the table
          sorted_versions = sorted(results_map.keys(), key=lambda x: int(x))
          for v in sorted_versions:
              rows += f"| {v} | " + " | ".join(results_map[v]) + " |\n"
          
          full_content = title + desc + header + sep + rows

          # 3. Write to README.md (mode 'w' overwrites everything)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(full_content)

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: overwrite readme with latest performance results [skip ci]" || exit 0
          git push
